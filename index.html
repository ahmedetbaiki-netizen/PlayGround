<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="theme-color" content="#05070f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<body>
<div class="bg-orbs" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="grid-overlay"></span></div>
<div id="click-fx-layer" aria-hidden="true"></div>

<header class="topbar glass">

    <div class="logo">🎓</div>

      <small>2005 → 2025 • جميع الشعب</small>
    </div>
  </div>
  <div class="top-actions">
    <button id="installBtn" class="btn primary hidden">📲 تثبيت التطبيق</button>
    <button id="fxToggle" class="btn ghost" title="تفعيل / إيقاف الأنيميشن">✨ المؤثرات: ON</button>

<div class="search-wrap">
  <div class="search glass">
    <span>🔍</span>

  </div>
  <div class="quick-filters" id="streamChips"></div>
</div>

<nav class="tabs glass" id="mainTabs">
  <button data-tab="home" class="active">🏠 الرئيسية</button>

  <button data-tab="exams">📝 امتحانات 2005-2025</button>

  <button data-tab="fav">⭐ المفضلة</button>
</nav>

<main id="app"></main>

<nav class="bottomnav glass">
  <button data-tab="home" class="active">🏠<small>الرئيسية</small></button>
  <button data-tab="streams">📚<small>الدروس</small></button>
  <button data-tab="exams">📝<small>امتحانات</small></button>
  <button data-tab="quiz">🧪<small>تجريبي</small></button>
  <button data-tab="fav">⭐<small>المفضلة</small></button>
</nav>

<div id="modal" class="modal hidden"><div class="modal-card glass" id="modalCard"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="./data.js"></script>
<script src="./app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
